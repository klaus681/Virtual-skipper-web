<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Skipper Web - 3D Sailing Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
            background-color: #0b132b;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .glass-btn {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.2s ease;
        }
        .glass-btn:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- HUD OVERLAY PRIMA VERSIONE -->
    <div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
        
        <!-- HEADER / INSTRUMENTS TOP BAR -->
        <div class="flex justify-between items-start pointer-events-auto">
            <!-- TACTICAL TELEMETRY DASHBOARD -->
            <div class="glass-panel rounded-xl p-4 flex gap-6 text-white font-mono text-sm">
                <div>
                    <div class="text-xs text-cyan-400 font-sans uppercase tracking-wider font-bold">Speed (BS)</div>
                    <div class="text-2xl font-bold"><span id="val-speed">0.0</span> <span class="text-xs text-gray-400">kn</span></div>
                </div>
                <div class="border-l border-slate-700 pl-6">
                    <div class="text-xs text-cyan-400 font-sans uppercase tracking-wider font-bold">Heading (HDG)</div>
                    <div class="text-2xl font-bold"><span id="val-hdg">000</span>°</div>
                </div>
                <div class="border-l border-slate-700 pl-6">
                    <div class="text-xs text-cyan-400 font-sans uppercase tracking-wider font-bold">Wind (TWA / TWS)</div>
                    <div class="text-2xl font-bold"><span id="val-twa">045</span>° / <span class="text-cyan-300">14 kn</span></div>
                </div>
                <div class="border-l border-slate-700 pl-6">
                    <div class="text-xs text-cyan-400 font-sans uppercase tracking-wider font-bold">VMG</div>
                    <div class="text-2xl font-bold text-emerald-400"><span id="val-vmg">0.0</span> <span class="text-xs text-gray-400">kn</span></div>
                </div>
            </div>

            <!-- CONTROLS & CAMERA SELECTOR -->
            <div class="glass-panel rounded-xl p-3 flex gap-2">
                <button id="cam-chase" class="glass-btn text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-cyan-400">
                    <i class="fa-solid fa-video"></i> Chase Cam
                </button>
                <button id="cam-tactical" class="glass-btn text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-eye"></i> Vista Tattica
                </button>
            </div>
        </div>

        <!-- BOTTOM CONTROLS & COMPASS -->
        <div class="flex justify-between items-end pointer-events-auto">
            <!-- KEYBOARD CONTROLS GUIDE -->
            <div class="glass-panel rounded-xl p-4 text-xs text-gray-200 space-y-1.5 font-mono">
                <div class="font-bold text-cyan-400 font-sans mb-1 uppercase tracking-wider">Controlli Tastiera</div>
                <div><kbd class="px-2 py-0.5 bg-slate-800 border border-slate-600 rounded text-cyan-300">A</kbd> / <kbd class="px-2 py-0.5 bg-slate-800 border border-slate-600 rounded text-cyan-300">D</kbd> : Timone (Orza / Poggia)</div>
                <div><kbd class="px-2 py-0.5 bg-slate-800 border border-slate-600 rounded text-cyan-300">W</kbd> / <kbd class="px-2 py-0.5 bg-slate-800 border border-slate-600 rounded text-cyan-300">S</kbd> : Cazza / Lasca Randa</div>
                <div><kbd class="px-2 py-0.5 bg-slate-800 border border-slate-600 rounded text-cyan-300">Mouse Drag</kbd> : Ruota Telecamera 3D</div>
            </div>

            <!-- ANEMOMETER DIAL MINI-WIDGET -->
            <div class="glass-panel rounded-full w-28 h-28 flex items-center justify-center relative shadow-2xl">
                <div class="text-[10px] font-bold text-cyan-400 absolute top-2 uppercase">Vento</div>
                <i id="wind-arrow" class="fa-solid fa-long-arrow-down text-3xl text-cyan-400 transition-transform duration-200"></i>
                <div class="text-xs font-mono font-bold text-white absolute bottom-2">14 kn</div>
            </div>
        </div>
    </div>

    <!-- APPLICATION CODE -->
    <script>
        // GAME STATE
        const boatState = {
            heading: 0,         // Gradi (0 - 360)
            speed: 0,           // Nodi
            rudder: 0,          // -1 (sinistra) a 1 (destra)
            sailTrim: 0.5,      // 0 (cazzata) a 1 (lasciata)
            windDir: 45,        // Direzione vento (45 gradi)
            windSpeed: 14       // Nodi
        };

        // SCENE SETUP
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b);
        scene.fog = new THREE.FogExp2(0x1e293b, 0.002);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 8, -18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;

        // LIGHTS
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(100, 150, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // MARE 3D
        const waterGeo = new THREE.PlaneGeometry(1000, 1000, 64, 64);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x0f4c81,
            roughness: 0.1,
            metalness: 0.8,
            wireframe: false
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        scene.add(water);

        // SCAFO & BARCA 3D
        const boatGroup = new THREE.Group();

        // Hull
        const hullGeo = new THREE.ConeGeometry(1.8, 8, 8);
        hullGeo.rotateX(Math.PI / 2);
        hullGeo.scale(1, 0.5, 1);
        const hullMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
        const hull = new THREE.Mesh(hullGeo, hullMat);
        hull.position.y = 0.4;
        boatGroup.add(hull);

        // Mast
        const mastGeo = new THREE.CylinderGeometry(0.08, 0.1, 9);
        const mastMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
        const mast = new THREE.Mesh(mastGeo, mastMat);
        mast.position.set(0, 4.5, 0.5);
        boatGroup.add(mast);

        // Main Sail
        const sailShape = new THREE.Shape();
        sailShape.moveTo(0, 0);
        sailShape.lineTo(0, 7.5);
        sailShape.lineTo(-3.2, 0.8);
        sailShape.closePath();
        const sailGeo = new THREE.ShapeGeometry(sailShape);
        const sailMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, roughness: 0.3 });
        const mainSail = new THREE.Mesh(sailGeo, sailMat);
        mainSail.position.set(0, 0.8, 0.5);
        boatGroup.add(mainSail);

        scene.add(boatGroup);

        // CONTROLLI TASTIERA
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // CAMERA MODE TOGGLE
        document.getElementById('cam-chase').addEventListener('click', () => {
            camera.position.set(0, 8, -18);
        });
        document.getElementById('cam-tactical').addEventListener('click', () => {
            camera.position.set(0, 35, -50);
        });

        // LOOP DI SIMULAZIONE E RENDERING
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // Timone (A/D)
            if (keys['a']) boatState.heading -= 40 * dt;
            if (keys['d']) boatState.heading += 40 * dt;

            // Normalizza Heading (0-360)
            boatState.heading = (boatState.heading % 360 + 360) % 360;

            // Trim Vele (W/S)
            if (keys['w']) boatState.sailTrim = Math.max(0.0, boatState.sailTrim - 0.5 * dt);
            if (keys['s']) boatState.sailTrim = Math.min(1.0, boatState.sailTrim + 0.5 * dt);

            // Calcolo Fisica Nautica Semplificata
            const twa = Math.abs(((boatState.heading - boatState.windDir + 180) % 360) - 180);
            const targetSpeed = Math.sin(twa * Math.PI / 180) * 8.5;
            boatState.speed += (targetSpeed - boatState.speed) * 0.05;

            // Movimento Barca nel Mondo 3D
            const rad = boatState.heading * Math.PI / 180;
            boatGroup.rotation.y = -rad;
            boatGroup.position.x += Math.sin(rad) * boatState.speed * dt * 0.8;
            boatGroup.position.z += Math.cos(rad) * boatState.speed * dt * 0.8;

            // Angolo Randa rispetto al vento
            mainSail.rotation.y = (boatState.sailTrim - 0.5) * 1.4;

            // Segui barca con la telecamera
            controls.target.copy(boatGroup.position);

            // Aggiorna Interfaccia Utente TELEMETRIA
            document.getElementById('val-speed').innerText = boatState.speed.toFixed(1);
            document.getElementById('val-hdg').innerText = Math.round(boatState.heading).toString().padStart(3, '0');
            document.getElementById('val-twa').innerText = Math.round(twa).toString().padStart(3, '0');
            document.getElementById('val-vmg').innerText = (boatState.speed * Math.cos(twa * Math.PI / 180)).toFixed(1);
            document.getElementById('wind-arrow').style.transform = `rotate(${boatState.windDir - boatState.heading}deg)`;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
